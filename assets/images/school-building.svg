<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e6b"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#e8c84a"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- School building -->
  <g transform="translate(400, 280)">
    <!-- Main building -->
    <rect x="-150" y="-80" width="300" height="160" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <!-- Roof -->
    <line x1="-170" y1="-80" x2="170" y2="-80" stroke="url(#gold)" stroke-width="3"/>
    <!-- Windows -->
    <rect x="-120" y="-60" width="40" height="50" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <rect x="-60" y="-60" width="40" height="50" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <rect x="0" y="-60" width="40" height="50" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <rect x="60" y="-60" width="40" height="50" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <rect x="120" y="-60" width="40" height="50" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <!-- Door -->
    <rect x="-25" y="10" width="50" height="70" fill="url(#gold)" opacity="0.3"/>
    <!-- Sign -->
    <rect x="-60" y="-95" width="120" height="20" fill="none" stroke="url(#gold)" stroke-width="1.5" rx="3"/>
    <text x="0" y="-80" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" letter-spacing="2">HUTCHINGS</text>
  </g>
  
  <text x="400" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#c9a227" letter-spacing="3">HUTCHINGS HIGH SCHOOL</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">PUNE &amp; TALEGAON</text>
</svg>