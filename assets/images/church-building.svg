<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#2c3e6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#e8c84a"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Decorative pattern -->
  <g opacity="0.1">
    <circle cx="400" cy="300" r="250" fill="none" stroke="#c9a227" stroke-width="2"/>
    <circle cx="400" cy="300" r="200" fill="none" stroke="#c9a227" stroke-width="1"/>
    <circle cx="400" cy="300" r="150" fill="none" stroke="#c9a227" stroke-width="1"/>
  </g>
  
  <!-- Church silhouette -->
  <g transform="translate(400, 320)">
    <!-- Main building -->
    <rect x="-100" y="-60" width="200" height="140" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- Roof -->
    <polygon points="-120,-60 0,-120 120,-60" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- Cross on top -->
    <line x1="0" y1="-120" x2="0" y2="-150" stroke="url(#gold)" stroke-width="3"/>
    <line x1="-10" y1="-140" x2="10" y2="-140" stroke="url(#gold)" stroke-width="3"/>
    <!-- Door -->
    <path d="M-20,80 L-20,20 A20,20 0 0,1 20,20 L20,80 Z" fill="url(#gold)" opacity="0.6"/>
    <!-- Windows -->
    <line x1="-70" y1="-10" x2="-70" y2="40" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
    <line x1="70" y1="-10" x2="70" y2="40" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
    <!-- Tower -->
    <rect x="80" y="-95" width="40" height="90" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#c9a227" letter-spacing="3">MUMBAI REGIONAL CONFERENCE</text>
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#ffffff" opacity="0.8" letter-spacing="2">METHODIST CHURCH IN INDIA</text>
</svg>